name: Build TinyGo WASM and Deploy to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26"

      - name: Set up TinyGo
        uses: nicolo-ribaudo/setup-tinygo@v1
        with:
          tinygo-version: "0.41.1"

      - name: Run tests
        run: make test

      - name: Build TinyGo WASM binary
        run: make build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web/"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
