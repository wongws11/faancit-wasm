<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>粵語反切轉換器</title>
    <script type="module">
        import init from "./pkg/faancit_wasm.js";

        init().catch((error) => {
            console.error("Failed to initialize the faancit converter:", error);
        });
    </script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        :root {
            --bg: #f0f0f5;
            --surface: #ffffff;
            --border: #d0d0d8;
            --text-primary: #1c1c1e;
            --text-secondary: #6e6e73;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --radius: 14px;
            --accent: #0071e3;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1c1e;
                --surface: #2c2c2e;
                --border: #3a3a3c;
                --text-primary: #f5f5f7;
                --text-secondary: #98989d;
                --shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            }
        }

        html {
            scrollbar-gutter: stable;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            padding: 48px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin: 0 0 32px;
        }

        .field {
            width: 100%;
            max-width: 360px;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            align-items: center;
            background-color: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .input-row:focus-within {
            border-color: var(--accent);
        }

        .input-row input {
            flex: 1;
            border: none;
            outline: none;
            padding: 14px 12px;
            font-size: 17px;
            background: transparent;
            color: var(--text-primary);
            min-width: 0;
        }

        .input-row input::placeholder {
            color: var(--text-secondary);
        }

        .unit {
            padding: 0 14px;
            font-size: 17px;
            color: var(--text-secondary);
            white-space: nowrap;
            border-left: 1.5px solid var(--border);
            align-self: stretch;
            display: flex;
            align-items: center;
        }

        .output-section {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .output-card {
            background-color: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
        }

        .output-card label {
            margin-bottom: 6px;
        }

        .output-card p {
            margin: 0;
            font-size: 20px;
            font-weight: 500;
            min-height: 28px;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <h1>粵語反切轉換器</h1>

    <div class="field">
        <label for="input">輸入反切</label>
        <div class="input-row">
            <input id="input" type="text" inputmode="text" autocomplete="off"
                autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="德紅">
            <span class="unit">切</span>
        </div>
    </div>

    <div class="output-section">
        <div class="output-card">
            <label>粵音</label>
            <p id="output"></p>
        </div>
        <div class="output-card">
            <label>讀若</label>
            <p id="pronunciations"></p>
        </div>
    </div>
</body>

</html>
